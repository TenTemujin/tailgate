name: catalog
# Weekly fresh scrape, published to the rolling `catalog-latest` pre-release.
# Installed apps download it at startup when their local catalog is older than 7 days.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Scrape
        run: npx tsx src/cli.ts scrape --json > report.json
      - name: Sanity check (never publish an empty or tiny catalog)
        run: node -e "const c=require(process.env.HOME+'/.tailgate/catalog.json'); if(!Array.isArray(c)||c.length<20){console.error('catalog too small:',c.length);process.exit(1)}"
      - name: Publish
        run: |
          gh release view catalog-latest >/dev/null 2>&1 || gh release create catalog-latest --prerelease --title "Catalog (rolling)" --notes "Automated weekly catalog. Not an app release."
          gh release upload catalog-latest "$HOME/.tailgate/catalog.json" "$HOME/.tailgate/scrape-report.json" --clobber
