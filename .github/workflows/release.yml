name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: sed -i "s/VERSION = '.*'/VERSION = '${GITHUB_REF_NAME#v}'/" src/version.ts
      - run: npx tsc --noEmit
      - name: Fresh catalog snapshot
        run: (npx tsx src/cli.ts scrape --json > /dev/null && cp ~/.tailgate/catalog.json src/snapshot.json) || echo "scrape failed, keeping committed snapshot"
      - run: KEEP_SNAPSHOT=1 node scripts/build.mjs all
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: 'dist/tailgate-*' }
